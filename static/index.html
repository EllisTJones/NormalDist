<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normal Distribution Calculator</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --border:#d0d7de; --accent:#2563eb; --shade:rgba(37,99,235,.35); --err:#c62828; }
  :root { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg:#14171c; --fg:#e6e8eb; --muted:#9aa4af; --border:#2f353d; --accent:#60a5fa; --shade:rgba(96,165,250,.4); --err:#ef7b7b; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#14171c; --fg:#e6e8eb; --muted:#9aa4af; --border:#2f353d; --accent:#60a5fa; --shade:rgba(96,165,250,.4); --err:#ef7b7b; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
  .top h1 { margin:0; }
  .ghost { padding:6px 12px; font-size:.85rem; color:var(--fg); background:transparent; border:1px solid var(--border); }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; padding:8px 10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:6px; }
  .full { grid-column:1 / -1; }
  button { padding:10px 18px; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  #error { color:var(--err); min-height:1.5em; margin:10px 0 0; }
  #results { margin-top:12px; }
  #results p { margin:2px 0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  canvas { display:block; width:100%; height:320px; margin-top:8px; border:1px solid var(--border); border-radius:6px; cursor:grab; touch-action:none; }
  canvas.dragging { cursor:grabbing; }
  .hint { font-size:.8rem; color:var(--muted); margin:6px 0 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Normal Distribution Calculator</h1>
    <button id="theme" class="ghost" type="button"></button>
  </div>

  <div class="grid">
    <div><label for="mean">Mean (μ)</label><input id="mean" type="number" step="any" value="0"></div>
    <div><label for="sd">Standard deviation (σ)</label><input id="sd" type="number" step="any" value="1"></div>

    <div class="full">
      <label for="area">Area</label>
      <select id="area">
        <option value="1">Above</option>
        <option value="2">Below</option>
        <option value="3" selected>Between intervals</option>
        <option value="4">Outside intervals</option>
      </select>
    </div>

    <div id="singleWrap" class="full hidden"><label for="single">Value</label><input id="single" type="number" step="any" value="1.96"></div>
    <div id="leftWrap"><label for="left">Lefthand interval</label><input id="left" type="number" step="any" value="-1.96"></div>
    <div id="rightWrap"><label for="right">Righthand interval</label><input id="right" type="number" step="any" value="1.96"></div>
  </div>

  <p style="margin-top:14px"><button id="go">Calculate</button></p>
  <p id="error"></p>
  <div id="results"></div>

  <div class="toolbar">
    <button id="zoomIn" class="ghost" type="button">Zoom in</button>
    <button id="zoomOut" class="ghost" type="button">Zoom out</button>
    <button id="reset" class="ghost" type="button">Reset</button>
    <button id="save" class="ghost" type="button">Save image</button>
  </div>
  <canvas id="chart"></canvas>
  <p class="hint">Scroll to zoom, drag to pan, double-click to reset.</p>
</main>

<script>
// This page does no statistics. It sends the inputs to Python (/api/calc)
// and displays whatever comes back.
const $ = id => document.getElementById(id);
const areaSel = $("area");
const cv = $("chart");
const PAD = { L: 16, R: 16, T: 40, B: 30 };
const MIN_FRAC = 1 / 200;       // the closest zoom: 1/200 of the full range

let lastData = null;
let full = null;                 // full x-range of the data from Python
let view = null;                 // currently visible x-range

function syncFields() {
  const a = areaSel.value;
  $("singleWrap").classList.toggle("hidden", !(a === "1" || a === "2"));
  $("leftWrap").classList.toggle("hidden", a === "1" || a === "2");
  $("rightWrap").classList.toggle("hidden", a === "1" || a === "2");
}
areaSel.addEventListener("change", syncFields);
syncFields();

async function calculate() {
  const err = $("error"), out = $("results");
  err.textContent = "";
  const q = new URLSearchParams({
    mean: $("mean").value, sd: $("sd").value, area: areaSel.value,
    value: $("single").value, left: $("left").value, right: $("right").value,
  });
  try {
    const res = await fetch("/api/calc?" + q);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed.");
    lastData = data;
    out.innerHTML =
      `<p><strong>Probability:</strong> ${data.probability.toFixed(4)} or ${data.percent.toFixed(2)}%</p>` +
      data.zscores.map(z => `<p><strong>Z-score (${z.label}):</strong> ${z.z.toFixed(4)}</p>`).join("");
    resetView();
    draw();
  } catch (e) {
    out.innerHTML = ""; lastData = null;
    err.textContent = e.message;
  }
}
$("go").addEventListener("click", calculate);
document.querySelectorAll("input").forEach(i =>
  i.addEventListener("keydown", e => { if (e.key === "Enter") calculate(); }));

// ---- Zoom / pan state ----
function resetView() {
  if (!lastData) return;
  const xs = lastData.xs;
  full = { x0: xs[0], x1: xs[xs.length - 1] };
  view = { x0: full.x0, x1: full.x1 };
}
function clampView() {
  const fw = full.x1 - full.x0;
  let w = Math.min(view.x1 - view.x0, fw);
  w = Math.max(w, fw * MIN_FRAC);
  const x0 = Math.max(full.x0, Math.min(view.x0, full.x1 - w));
  view = { x0, x1: x0 + w };
}
function zoomAt(frac, factor) {      // frac: 0..1 position across the plot area
  if (!lastData) return;
  const w = view.x1 - view.x0;
  const cx = view.x0 + frac * w;
  const nw = w * factor;
  view = { x0: cx - frac * nw, x1: cx - frac * nw + nw };
  clampView();
  draw();
}

// ---- Plot (draws the points Python sent, within the current view) ----
function niceTicks(a, b, target) {
  const raw = (b - a) / target;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const decimals = Math.max(0, -Math.floor(Math.log10(step)));
  const ticks = [];
  for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-9; v += step) {
    ticks.push({ v, label: v.toFixed(decimals) });
  }
  return ticks;
}

function draw() {
  if (!lastData) return;
  const d = lastData, xs = d.xs, ys = d.ys;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--bg").trim();
  const fg = css.getPropertyValue("--fg").trim();
  const muted = css.getPropertyValue("--muted").trim();
  const accent = css.getPropertyValue("--accent").trim();
  const shade = css.getPropertyValue("--shade").trim();

  ctx.fillStyle = bg;                      // solid background so saved images aren't transparent
  ctx.fillRect(0, 0, W, H);

  const { x0, x1 } = view;
  let vmax = 0;                            // fit the height to what is visible
  for (let i = 0; i < xs.length; i++) if (xs[i] >= x0 && xs[i] <= x1 && ys[i] > vmax) vmax = ys[i];
  if (vmax === 0) vmax = Math.max(...ys);
  const ymax = vmax * 1.12;

  const plotW = W - PAD.L - PAD.R;
  const px = x => PAD.L + (x - x0) / (x1 - x0) * plotW;
  const py = y => H - PAD.B - y / ymax * (H - PAD.T - PAD.B);

  // everything inside the plot area is clipped to it
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAD.L, PAD.T - 4, plotW, H - PAD.T - PAD.B + 6);
  ctx.clip();

  ctx.fillStyle = shade;
  let run = [];
  const flush = () => {
    if (run.length >= 2) {
      ctx.beginPath();
      ctx.moveTo(px(xs[run[0]]), py(0));
      run.forEach(i => ctx.lineTo(px(xs[i]), py(ys[i])));
      ctx.lineTo(px(xs[run[run.length - 1]]), py(0));
      ctx.closePath(); ctx.fill();
    }
    run = [];
  };
  xs.forEach((x, i) => { if (d.shade[i]) run.push(i); else flush(); });
  flush();

  ctx.strokeStyle = accent; ctx.lineWidth = 2;
  ctx.beginPath();
  xs.forEach((x, i) => i ? ctx.lineTo(px(x), py(ys[i])) : ctx.moveTo(px(x), py(ys[i])));
  ctx.stroke();
  ctx.restore();

  // axis and ticks
  ctx.strokeStyle = fg; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD.L, py(0)); ctx.lineTo(W - PAD.R, py(0)); ctx.stroke();
  ctx.fillStyle = muted; ctx.font = "12px system-ui, sans-serif"; ctx.textAlign = "center";
  niceTicks(x0, x1, 7).forEach(t => {
    ctx.beginPath(); ctx.moveTo(px(t.v), py(0)); ctx.lineTo(px(t.v), py(0) + 5); ctx.stroke();
    ctx.fillText(t.label, px(t.v), py(0) + 18);
  });

  // title
  ctx.fillStyle = fg; ctx.font = "13px system-ui, sans-serif";
  ctx.fillText(`Normal(μ=${d.mean}, σ=${d.sd})`, W / 2, 16);
  ctx.fillText("z-score(s): " + d.zscores.map(z => z.z.toFixed(4)).join(", "), W / 2, 32);
}

// ---- Toolbar ----
$("zoomIn").addEventListener("click", () => zoomAt(0.5, 1 / 1.5));
$("zoomOut").addEventListener("click", () => zoomAt(0.5, 1.5));
$("reset").addEventListener("click", () => { resetView(); draw(); });
$("save").addEventListener("click", () => {
  if (!lastData) return;
  cv.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "normal_distribution.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
});

// ---- Mouse / touch: wheel to zoom, drag to pan, double-click to reset ----
let drag = null;
cv.addEventListener("pointerdown", e => {
  if (!lastData) return;
  drag = { x: e.clientX, v: { ...view } };
  cv.setPointerCapture(e.pointerId);
  cv.classList.add("dragging");
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const plotW = cv.clientWidth - PAD.L - PAD.R;
  const dx = (e.clientX - drag.x) / plotW * (drag.v.x1 - drag.v.x0);
  view = { x0: drag.v.x0 - dx, x1: drag.v.x1 - dx };
  clampView();
  draw();
});
const endDrag = () => { drag = null; cv.classList.remove("dragging"); };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("wheel", e => {
  if (!lastData) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - r.left - PAD.L) / (r.width - PAD.L - PAD.R)));
  zoomAt(frac, e.deltaY < 0 ? 1 / 1.2 : 1.2);
}, { passive: false });
cv.addEventListener("dblclick", () => { resetView(); draw(); });

window.addEventListener("resize", draw);

// ---- Light / dark toggle ----
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t, save) {
  document.documentElement.dataset.theme = t;
  if (save) { try { localStorage.setItem("theme", t); } catch (e) {} }
  $("theme").textContent = t === "dark" ? "☀ Light mode" : "🌙 Dark mode";
  draw();
}
$("theme").addEventListener("click", () => applyTheme(currentTheme() === "dark" ? "light" : "dark", true));

let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
applyTheme(currentTheme(), false);
calculate();
</script>
</body>
</html>
